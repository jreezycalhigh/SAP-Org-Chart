name: Auto Compile Excel to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'SAP_Account_Priority_Outreach_List_v16.xlsx'
      - 'generate_final_html.py'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run HTML Compiler
        run: python generate_final_html.py

      - name: Commit and Push Compiled HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add SAP_Account_Priority_Outreach_Hub.html
          if git diff --staged --quiet; then
            echo "No changes in compiled HTML."
          else
            git commit -m "Auto-compile Excel source changes to HTML [skip ci]"
            git push
          fi
